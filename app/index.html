<style>
:root{--ink:#1f2328;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--card:#fff;--accent:#8ea9db;--accent-d:#2f4a7d;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header.app{display:flex;align-items:center;gap:12px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header.app img{height:28px}
nav{display:flex;gap:2px;margin-left:8px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 13px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--muted)}
nav button.on{background:var(--bg);color:var(--ink);font-weight:600}
.sp{flex:1}
main{padding:20px;max-width:1400px;margin:0 auto}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#c7cbd1}
.btn.pri{background:var(--accent-d);color:#fff;border-color:var(--accent-d)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.sync{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:#fff}
.sync.ok{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
.sync.warn{color:var(--warn);border-color:#fde68a;background:#fffbeb}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi .l{color:var(--muted);font-size:12px}.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
table.list{width:100%;border-collapse:collapse;background:#fff}
table.list th,table.list td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.list th{font-size:12px;color:var(--muted);font-weight:600;background:#fafafa}
table.list td.r,table.list th.r{text-align:right;white-space:nowrap}
table.list tbody tr{cursor:pointer}
table.list tr:hover td{background:#fafbff}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.brouillon{background:#f3f4f6;color:#4b5563}.tag.envoyee{background:#fef3c7;color:var(--warn)}.tag.payee{background:#dcfce7;color:var(--ok)}.tag.devis{background:#e0e7ff;color:#3730a3}.tag.retard{background:#fee2e2;color:var(--bad)}
.tag.s1{background:#f3f4f6;color:#374151}.tag.s2{background:#e0f2fe;color:#0369a1}.tag.s3{background:#ede9fe;color:#6d28d9}.tag.s4{background:#fae8ff;color:#a21caf}.tag.s5{background:#fef3c7;color:#b45309}.tag.s6{background:#dcfce7;color:#15803d}.tag.s7{background:#fee2e2;color:#b91c1c}.tag.s8{background:#f1f5f9;color:#475569}.tag.s0{background:#fff;color:#9ca3af;border:1px dashed #d1d5db}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.editor{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:20px;align-items:start}
.editor .form{display:flex;flex-direction:column;gap:12px}
.lines .ln{display:grid;grid-template-columns:1fr 60px 80px 60px 28px;gap:6px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.lines .ln textarea{min-height:34px}
.lines .ln.note{grid-template-columns:1fr 28px}
.lines .ln.pct{grid-template-columns:1fr 60px 28px}
.lines .hd{font-size:11px;color:var(--muted)}
.previewWrap{position:sticky;top:64px;overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 84px);background:#e5e7eb;border-radius:10px;padding:16px}
.previewWrap .scaler{transform-origin:top left}
h2{margin:0 0 12px;font-size:18px}
h3{margin:0 0 10px;font-size:14px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.cols{display:grid;grid-template-columns:minmax(420px,1.1fr) 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.todo{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.todo:last-child{border:0}
.todo .d{width:86px;font-size:12px;color:var(--muted)}
.todo .d.late{color:var(--bad);font-weight:700}
.act{padding:8px 0;border-bottom:1px solid var(--line)}
.act:last-child{border:0}
.act .t{font-size:12px;color:var(--muted)}
.chk{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.chk label{display:flex;gap:6px;align-items:center;padding:2px 0;font-size:13px;color:var(--ink)}
details summary{cursor:pointer;font-size:13px;color:var(--accent-d);margin:6px 0}
.banner{background:#fffbeb;border:1px solid #fde68a;color:#78350f;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ===== Document A4 (positions en mm depuis le bord de la feuille) ===== */
.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#000;font-size:10.5pt;line-height:1.35;box-shadow:0 2px 12px rgba(0,0,0,.15);margin:0 auto 16px}
.p-logo{position:absolute;left:20mm;top:15mm;height:14mm}
.p-from{position:absolute;left:20mm;top:38mm;font-size:9.5pt;line-height:1.4}
.p-from b{font-size:11pt}
.p-ret{position:absolute;font-size:7pt;color:#444;border-bottom:.4pt solid #444;white-space:nowrap}
.p-addr{position:absolute;width:85mm;font-size:11pt;line-height:1.35}
.p-title{position:absolute;left:20mm;top:86mm;font-size:18pt;color:#595959;letter-spacing:.3px}
.p-meta{position:absolute;left:20mm;right:18mm;top:97mm;display:flex;gap:10mm;font-size:9.5pt}
.p-meta div span{display:block;color:#7f7f7f;font-size:8pt}
.p-body{position:absolute;left:20mm;right:18mm;top:110mm}
.obj-l{font-size:9pt;color:#555}
.obj{background:var(--accent);border-top:1.2pt solid #000;padding:2.2mm 1.5mm;font-family:Arial,sans-serif;font-size:12pt;margin-bottom:4mm}
table.items{width:100%;border-collapse:collapse}
table.items th{text-align:left;font-weight:700;border-bottom:1.5pt solid #000;padding:1mm 1.5mm}
table.items td{padding:1.1mm 1.5mm;vertical-align:bottom}
table.items .n{text-align:right;white-space:nowrap}
table.items .c{text-align:center}
table.items tr.note td{font-style:italic;padding-top:2.5mm}
table.items tr.last td{border-bottom:1.5pt solid #000}
table.items .desc{white-space:pre-line}
.totals{margin-left:auto;width:85mm;margin-top:1mm}
.totals .r{display:flex;justify-content:space-between;padding:1mm 1.5mm}
.totals .grand{border-top:1pt solid #000;font-weight:700;margin-top:6mm}
.doc-text{margin-top:8mm;white-space:pre-line}
.doc-sign{margin:7mm 0 0 85mm}
.doc-bank{display:flex;margin-top:7mm;font-size:9.5pt}
.doc-bank .l{width:85mm;text-align:right;padding-right:4mm}
.p-foot{position:absolute;left:20mm;right:18mm;bottom:10mm;text-align:center;font-size:7.5pt;color:#7f7f7f;border-top:.5pt solid #ccc;padding-top:2mm}
.l-date{position:absolute;left:117mm;top:88mm;font-size:10.5pt}
.l-body{position:absolute;left:20mm;right:20mm;top:102mm;font-size:11pt;line-height:1.45}
.l-body .subj{font-weight:700;margin-bottom:7mm}
.l-body .txt{white-space:pre-line;text-align:justify}
.l-body .sig{margin-top:12mm}
.win{position:absolute;border:.6mm dashed #e11d48;width:100mm;height:45mm;color:#e11d48;font-size:9pt;padding:2mm}

/* ===== QR-facture ===== */
.qrbill{position:absolute;left:0;bottom:0;width:210mm;height:105mm;border-top:.3pt dashed #000;font-family:Arial,Helvetica,sans-serif;color:#000;display:flex}
.qrbill .scis{position:absolute;top:-3.2mm;left:4mm;font-size:9pt}
.qr-rec{width:62mm;padding:5mm;border-right:.3pt dashed #000;position:relative}
.qr-pay{width:148mm;padding:5mm;display:flex;position:relative}
.qrbill h4{margin:0 0 3.5mm;font-size:11pt;font-weight:700}
.qr-rec .h{font-size:6pt;font-weight:700;margin-top:2mm}.qr-rec .v{font-size:8pt;line-height:9pt}
.qr-pay .h{font-size:8pt;font-weight:700;margin-top:2.5mm}.qr-pay .v{font-size:10pt;line-height:11pt}
.qr-col1{width:51mm}
.qr-col2{flex:1;padding-left:3mm}
.qr-code{width:46mm;height:46mm;margin:1.5mm 0 4mm}
.qr-code svg{width:46mm;height:46mm;display:block}
.qr-amt{display:flex;gap:6mm}
.qr-rec .acc{position:absolute;right:5mm;top:82mm;font-size:6pt;font-weight:700}

#print{display:none}
/* force l'impression des couleurs de fond (bandeau bleu) : sans ça, Edge/Chrome les suppriment */
.page,.page *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  header.app,main,.toast{display:none!important}
  #print{display:block}
  #print .page{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  #print .page:last-child{page-break-after:auto;break-after:auto}
}
@media (max-width:1000px){.editor,.cols{grid-template-columns:1fr}.previewWrap{position:static;max-height:none}.grid4{grid-template-columns:1fr 1fr}}
/* ===== iPhone ===== */
@media (max-width:700px){
  body{font-size:15px;overflow-x:hidden}
  header.app{padding:6px 10px calc(6px) 10px;padding-top:max(6px,env(safe-area-inset-top));gap:6px}
  header.app img{height:22px}
  nav{margin-left:0;order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  nav button{padding:8px 10px;font-size:14px;flex:none}
  .sync{font-size:11px;padding:4px 8px}
  main{padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  [style*="grid-column:span"]{grid-column:auto!important}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi .v{font-size:18px}
  .card{padding:12px}
  input,select,textarea{font-size:16px}  /* évite le zoom automatique de Safari */
  .lines .ln{grid-template-columns:1fr 1fr 1fr 34px}
  .lines .ln>:first-child{grid-column:1/-1}
  .lines .ln.pct{grid-template-columns:1fr 70px 34px}.lines .ln.pct>:first-child{grid-column:auto}
  .lines .hd{display:none!important}
  .filters input,.filters select{max-width:none!important}
  table.list th,table.list td{padding:7px 6px;font-size:13px}
  .previewWrap{padding:8px}
  .todo .d{width:72px}
}
</style>
</head>

const cacheKey=()=>"tm-crm-cache-"+uid;
function saveLocal(){try{localStorage.setItem(cacheKey(),JSON.stringify({data:DB,remoteAt}))}catch(e){}}
function save(){DB.savedAt=Date.now();dirty=true;saveLocal();setSync("saving");clearTimeout(wTimer);wTimer=setTimeout(pushRemote,700)}
async function pushRemote(force){
  if(!dirty&&!force)return;
  if(saving){clearTimeout(wTimer);wTimer=setTimeout(pushRemote,500);return}
  saving=true;
  try{
    if(!force){const {data:row,error}=await sb.from("app_state").select("updated_at").eq("user_id",uid).maybeSingle();if(error)throw error;
      if(row&&remoteAt&&row.updated_at!==remoteAt){saving=false;setSync("conflict");return}}
    const {data,error}=await sb.from("app_state").upsert({user_id:uid,data:DB,updated_at:new Date().toISOString()}).select("updated_at").single();
    if(error)throw error;
    remoteAt=data.updated_at;dirty=false;saveLocal();setSync("ok");
  }catch(e){console.warn(e);setSync(navigator.onLine?"error":"offline")}
  saving=false;
}
async function pullRemote(){
  const {data,error}=await sb.from("app_state").select("data,updated_at").eq("user_id",uid).maybeSingle();
  if(error)throw error;
  if(!data)return false;
  DB=data.data;addDefaults(DB);remoteAt=data.updated_at;dirty=false;saveLocal();setSync("ok");return true;
}
/* quand on revient sur l'app (ex. après l'avoir utilisée sur l'iPhone), on recharge si les données ont changé ailleurs */
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!uid||dirty)return;
  try{const {data}=await sb.from("app_state").select("updated_at").eq("user_id",uid).maybeSingle();
    if(data&&data.updated_at!==remoteAt){await pullRemote();render();toast("Données mises à jour depuis ton autre appareil")}}catch(e){}
});
window.addEventListener("online",()=>{if(dirty)pushRemote()});
setInterval(()=>{if(dirty&&!saving&&(syncState==="offline"||syncState==="error"))pushRemote()},15000);
function setSync(s){syncState=s;const b=$("#sync");if(!b)return;
  const m={ok:["ok","● Enregistré en ligne"],saving:["ok","● Enregistrement…"],offline:["warn","⚠ Hors ligne – réessai auto"],error:["warn","⚠ Erreur d'enregistrement"],conflict:["warn","⚠ Modifié sur un autre appareil"],none:["",""]}[s];
  b.className="sync "+m[0];b.textContent=m[1];b.style.display=m[1]?"":"none";
  if(s==="conflict"&&(view==="home"))render()}
async function resolveConflict(keepMine){
  if(keepMine){await pushRemote(true);toast("Tes modifications ont été enregistrées")}
  else{await pullRemote();render();toast("Données rechargées")}
}
async function logout(){if(dirty&&!confirm("Des modifications ne sont pas encore enregistrées en ligne. Se déconnecter quand même ?"))return;
  try{localStorage.removeItem(cacheKey())}catch(e){}await sb.auth.signOut();location.reload()}

/* ================= Utilitaires ================= */
function $(s){return document.querySelector(s)}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
function money(n,cur){const v=r2(n);const neg=v<0;let [a,b]=Math.abs(v).toFixed(2).split(".");a=a.replace(/\B(?=(\d{3})+(?!\d))/g," ");return (neg?"-":"")+a+","+b+(cur?" "+cur:"")}
function numFr(n){return String(r2(n)).replace(".",",")}
function dFr(iso){if(!iso)return"";const [y,m,d]=iso.split("-");return d+"."+m+"."+y}
function dLong(iso){return new Date(iso+"T12:00").toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"})}
function todayIso(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function addDays(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function age(iso){if(!iso)return"";const b=new Date(iso),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a}
function client(id){return DB.clients.find(c=>c.id===id)||C({})}
const person=c=>[c.first,c.last].filter(Boolean).join(" ");
const cname=c=>c.company||person(c)||"(sans nom)";
const csort=c=>(c.company||((c.last||"")+" "+(c.first||""))).trim().toLowerCase();
const sortedClients=()=>DB.clients.slice().sort((a,b)=>csort(a).localeCompare(csort(b),"fr"));
const countryName=k=>k&&k!=="CH"?({FR:"France",DE:"Allemagne",IT:"Italie",AT:"Autriche"}[k]||k):"";
function politeOf(c){if(c.polite)return c.polite;if(c.civ&&c.last)return c.civ+" "+c.last;return "Madame, Monsieur"}
function salutOf(c){if(c.civ)return c.civ+",";return "Madame, Monsieur,"}
function addrLines(c,forInvoice){
  const b=forInvoice&&c.bill&&c.bill.street?c.bill:null;
  if(b)return [b.name,b.contact,b.street,(b.zip+" "+b.city).trim(),countryName(b.country)].filter(Boolean);
  const L=[];
  if(c.company){L.push(c.company);if(c.contact)L.push(c.contact)}
  else{if(c.civ)L.push(c.civ);L.push(person(c))}
  L.push(c.street,(c.zip+" "+c.city).trim(),countryName(c.country));
  return L.filter(Boolean);
}
function debtor(c){const b=c.bill&&c.bill.street?c.bill:null;const s=b||c;return {name:b?b.name:cname(c),street:s.street||"",zip:s.zip||"",city:s.city||"",country:s.country||"CH"}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),3200)}
function stTag(s){if(!s)return '<span class="tag s0">À compléter</span>';const n=s.charAt(0);return `<span class="tag s${n}">${esc(s.replace(/^\d - /,""))}</span>`}

function calc(f){
  let sub=0;const rows=[];
  f.lines.forEach(l=>{ if(!l.k||l.k==="fee"){const a=r2((+l.q||0)*(+l.p||0)*(1-(+l.r||0)/100));if(!l.k)sub+=a;rows.push({...l,a});} else rows.push({...l}); });
  let total=sub;
  rows.forEach(l=>{ if(l.k==="fee") total+=l.a; if(l.k==="pct"){l.q=1;l.p=r2(sub*(+l.pct||0)/100);l.a=l.p;total+=l.a;} });
  return {rows,total:r2(total)};
}
const dueDate=f=>addDays(f.date,DB.settings.delay||20);  /* échéance = date de facture + délai (jours calendaires) */
function isLate(f){return f.type==="facture"&&f.status==="envoyee"&&dueDate(f)<todayIso()}
function statusTag(f){
  if(f.type==="devis") return '<span class="tag devis">Devis</span>';
  if(isLate(f)) return '<span class="tag retard">En retard</span>';
  return {brouillon:'<span class="tag brouillon">Brouillon</span>',envoyee:'<span class="tag envoyee">Envoyée</span>',payee:'<span class="tag payee">Payée</span>'}[f.status]||"";
}
/* N° : AAAAJJMM-n, n = n-ième facture du client (comme dans les fichiers Excel) */
function nextNo(f){const [y,m,d]=(f.date||todayIso()).split("-");const n=DB.invoices.filter(x=>x.client===f.client&&x.type===f.type&&x.id!==f.id).length+1;return y+d+m+"-"+n}
function nextClientId(){return "CLI-"+String(Math.max(0,...DB.clients.map(x=>+x.id.replace(/\D/g,"")||0))+1).padStart(3,"0")}

/* ================= Facture / devis A4 ================= */
function docHTML(f){
  const s=DB.settings, c=client(f.client), {rows,total}=calc(f), cur=f.cur||"CHF";
  const hasR=rows.some(l=>+l.r);
  const polite=politeOf(c);
  const text=(f.text||"").trim()?f.text:(f.type==="devis"?"Voici mon offre pour le mandat décrit ci-dessus. Je reste à votre disposition pour toute question.\n\nVeuillez agréer, "+polite+", mes meilleures salutations.":s.text.replace("{delai}",s.delay).replace("{politesse}",polite));
  const tr=rows.map((l,i)=>{
    const last=i===rows.length-1;
    if(l.k==="note") return `<tr class="note${last?' last':''}"><td class="desc" colspan="${hasR?5:4}">${esc(l.d)}</td></tr>`;
    return `<tr${last?' class="last"':''}><td class="desc">${esc(l.d)}</td><td class="c">${numFr(l.q)}</td><td class="n">${money(l.p,cur)}</td>${hasR?`<td class="n">${l.r?numFr(l.r)+" %":""}</td>`:""}<td class="n">${money(l.a,cur)}</td></tr>`;
  }).join("");
  let html=`<div class="page">${headHTML(c,true)}
   <div class="p-title">${f.type==="devis"?"Devis":"Facture"}</div>
   <div class="p-meta"><div><span>N° ${f.type==="devis"?"devis":"facture"}</span>${esc(f.no)}</div><div><span>Date</span>${dFr(f.date)}</div><div><span>N° client</span>${esc(c.id)}</div>${f.type==="facture"?`<div><span>Payable jusqu'au</span>${dFr(dueDate(f))}</div>`:""}</div>
   <div class="p-body">
     <div class="obj-l">Objet</div>
     <div class="obj">${esc(f.subject)}</div>
     <table class="items"><colgroup><col><col style="width:14mm"><col style="width:30mm">${hasR?'<col style="width:18mm">':''}<col style="width:32mm"></colgroup>
      <thead><tr><th>Description</th><th class="c">Qté</th><th class="n">Prix</th>${hasR?'<th class="n">Rabais</th>':''}<th class="n">Montant</th></tr></thead>
      <tbody>${tr}</tbody></table>
     <div class="totals"><div class="r grand"><span>TOTAL</span><span>${money(total,cur)}</span></div></div>
     <div class="doc-text">${esc(text)}</div>
     <div class="doc-sign">${esc(s.name)}</div>
     <div class="doc-bank"><div class="l">Coordonnées bancaires :</div><div>${esc(s.bank)}<br>${esc(s.name)}<br><b>IBAN : ${esc(s.iban)}</b><br>BIC : ${esc(s.bic)}<br>Clearing : ${esc(s.clearing)}</div></div>
   </div></div>`;
  if(f.type==="facture"&&s.qr&&(f.qr!==false)) html+=`<div class="page">${qrBillHTML(f,total,c)}</div>`;
  return html;
}

/* ================= QR-facture suisse (norme SIX) ================= */
function qrPayload(f,total,c){
  const s=DB.settings, iban=s.iban.replace(/\s/g,""), d=debtor(c);
  const L=["SPC","0200","1",iban,"S",s.name,s.street,s.nr,s.zip,s.city,s.country||"CH","","","","","","","",total>0?total.toFixed(2):"",f.cur==="EUR"?"EUR":"CHF"];
  if(d.name) L.push("S",d.name.slice(0,70),d.street.slice(0,70),"",d.zip,d.city,d.country||"CH"); else L.push("","","","","","","");
  L.push("NON","","Facture "+f.no,"EPD");
  return L.join("\n");
}
function qrSVG(text){
  if(typeof qrcode==="undefined") return '<div style="font-size:8pt;border:1px solid #000;height:46mm;display:flex;align-items:center;justify-content:center;text-align:center;padding:4mm">QR indisponible<br>(connexion internet nécessaire)</div>';
  qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
  const q=qrcode(0,"M"); q.addData(text); q.make();
  const n=q.getModuleCount(); let p="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) p+=`M${c} ${r}h1v1h-1z`;
  const k=n/46, w=7*k, x=(n-w)/2, b=6*k, bx=(n-b)/2, a=b*0.2, l=b*0.6;
  return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${p}" fill="#000"/>
   <rect x="${x}" y="${x}" width="${w}" height="${w}" fill="#fff"/><rect x="${bx}" y="${bx}" width="${b}" height="${b}" fill="#000"/>
   <rect x="${n/2-a/2}" y="${n/2-l/2}" width="${a}" height="${l}" fill="#fff"/><rect x="${n/2-l/2}" y="${n/2-a/2}" width="${l}" height="${a}" fill="#fff"/></svg>`;
}
function qrBillHTML(f,total,c){
  const s=DB.settings, cur=f.cur==="EUR"?"EUR":"CHF", amt=total.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g," "), d=debtor(c);
  const cred=`${esc(s.iban)}<br>${esc(s.name)}<br>${esc(s.street+" "+s.nr)}<br>${esc(s.zip+" "+s.city)}`;
  const deb=[d.name,d.street,(d.zip+" "+d.city).trim()].filter(Boolean).map(esc).join("<br>");
  return `<div class="qrbill"><span class="scis">✂</span>
   <div class="qr-rec"><h4>Récépissé</h4>
    <div class="h">Compte / Payable à</div><div class="v">${cred}</div>
    <div class="h">Payable par</div><div class="v">${deb}</div>
    <div class="qr-amt" style="position:absolute;top:68mm"><div><div class="h">Monnaie</div><div class="v">${cur}</div></div><div><div class="h">Montant</div><div class="v">${amt}</div></div></div>
    <div class="acc">Point de dépôt</div></div>
   <div class="qr-pay"><div class="qr-col1"><h4>Section paiement</h4><div class="qr-code">${qrSVG(qrPayload(f,total,c))}</div>
     <div class="qr-amt"><div><div class="h">Monnaie</div><div class="v">${cur}</div></div><div><div class="h">Montant</div><div class="v">${amt}</div></div></div></div>
    <div class="qr-col2"><div class="h" style="margin-top:0">Compte / Payable à</div><div class="v">${cred}</div>
     <div class="h">Informations supplémentaires</div><div class="v">Facture ${esc(f.no)}</div>
     <div class="h">Payable par</div><div class="v">${deb}</div></div></div></div>`;
}

/* ================= Envoi par e-mail ================= */
const MAIL_DEF={
  subject:"{type} {no} – {marque}",
  body:"{bonjour}\n\nVeuillez trouver ci-joint ma {type_min} n° {no} du {date}, d'un montant de {montant}, payable jusqu'au {echeance}.\n\nVous pouvez la régler facilement en scannant le QR code avec votre application bancaire.\n\nJe reste à votre disposition pour toute question.\n\n{signature}",
  bodyDevis:"{bonjour}\n\nVeuillez trouver ci-joint mon devis n° {no} du {date}, d'un montant de {montant}.\n\nJe reste à votre disposition pour toute question et me réjouis de votre retour.\n\n{signature}"
};
const loadJs=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("chargement "+src));document.head.appendChild(s)});
const pdfName=f=>(f.type==="devis"?"Devis ":"Facture ")+f.no+" - "+cname(client(f.client)).replace(/[\\/:*?"<>|]/g,"")+".pdf";
/* PDF fidèle à l'impression : chaque page A4 est photographiée en haute définition (QR code lisible) */
async function makePdf(f){
  await loadJs("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const box=document.createElement("div");box.style.cssText="position:fixed;left:-10000px;top:0;width:210mm;background:#fff";
  box.innerHTML=docHTML(f);document.body.appendChild(box);
  try{
    await Promise.all([...box.querySelectorAll("img")].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    const pages=[...box.querySelectorAll(".page")];
    for(let i=0;i<pages.length;i++){
      pages[i].style.boxShadow="none";pages[i].style.margin="0";
      const cv=await html2canvas(pages[i],{scale:3,backgroundColor:"#ffffff",useCORS:true,logging:false});
      if(i)pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297);
    }
    return pdf.output("blob");
  }finally{box.remove()}
}
function mailText(f){
  const s=DB.settings,c=client(f.client),m=Object.assign({},MAIL_DEF,s.mail||{}),dv=f.type==="devis";
  const bonjour=c.company&&!c.civ?"Bonjour,":(c.civ&&c.last?"Bonjour "+c.civ+" "+c.last+",":"Bonjour,");
  /* par défaut, pas de signature texte : c'est Outlook qui ajoute la vraie signature (logo, mise en forme) */
  const sig=s.mailSig?[s.name,s.title,s.brand,s.phone,s.email,s.web].filter(Boolean).join("\n"):"";
  const v={type:dv?"Devis":"Facture",type_min:dv?"devis":"facture",no:f.no,date:dFr(f.date),montant:money(calc(f).total,f.cur||"CHF").replace(/ /g," "),
    echeance:dFr(dueDate(f)),objet:f.subject||"",marque:s.brand||s.name,bonjour,signature:sig,client:cname(c)};
  const fill=t=>String(t||"").replace(/\{(\w+)\}/g,(x,k)=>k in v?v[k]:x);
  return {to:(c.email||"").trim(),subject:fill(m.subject),body:fill(dv?m.bodyDevis:m.body).replace(/\s+$/,"")};
}
const isMobile=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
/* Brouillon Outlook (.eml) : « X-Unsent: 1 » fait qu'Outlook l'ouvre comme un NOUVEAU mail à envoyer, PDF déjà joint */
async function makeEml(to,sub,body,blob,name){
  const b64u=s=>btoa(unescape(encodeURIComponent(s)));
  const enc=s=>"=?UTF-8?B?"+b64u(s)+"?=";
  const wrap=s=>s.replace(/.{1,76}/g,"$&\r\n");
  const html=`<html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial,sans-serif;font-size:11pt">${esc(body).replace(/\r?\n/g,"<br>")}<br><br></body></html>`;
  const pdf64=blob?await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(blob)}):"";
  const B="----=_Marotta_"+Date.now();
  let m=(to?`To: ${to}\r\n`:"")+`Subject: ${enc(sub)}\r\nX-Unsent: 1\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${B}"\r\n\r\n`+
    `--${B}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap(b64u(html))}\r\n`;
  if(pdf64)m+=`--${B}\r\nContent-Type: application/pdf; name="${enc(name)}"\r\nContent-Transfer-Encoding: base64\r\nContent-Disposition: attachment; filename="${enc(name)}"\r\n\r\n${wrap(pdf64)}\r\n`;
  m+=`--${B}--\r\n`;
  return new Blob([m],{type:"message/rfc822"});
}

async function mailInv(f){
  const c=client(f.client),t=mailText(f);
  const dlg=document.createElement("div");

    <p class="muted" style="font-size:12px;margin-bottom:0">${isMobile()?"Le PDF est joint automatiquement : choisis <b>Outlook</b> dans la liste.":"Un mail prêt à envoyer (PDF joint) est créé : <b>clique dessus</b> dans la liste des téléchargements en haut à droite, Outlook l'ouvre. Ajoute ta signature (Insérer → Signature) puis Envoyer."}</p></div>`;
  document.body.appendChild(dlg);

  dlg.querySelector("#m_copy").onclick=async()=>{try{await navigator.clipboard.writeText(dlg.querySelector("#m_body").value);toast("Texte copié")}catch(e){toast("Copie impossible")}};
  let blob=null;

  try{blob=await makePdf(f);dlg.querySelector("#m_info").textContent="✅ PDF prêt : "+pdfName(f);dlg.querySelector("#m_go").disabled=false;if(pdfBtn){pdfBtn.disabled=false;pdfBtn.onclick=()=>downloadBlob(blob,pdfName(f))}}
  catch(e){console.warn(e);dlg.querySelector("#m_info").textContent="⚠ Le PDF n'a pas pu être créé (connexion internet ?). Tu peux quand même ouvrir le mail et joindre le PDF imprimé.";dlg.querySelector("#m_go").disabled=false}
  dlg.querySelector("#m_go").onclick=async()=>{
    const to=dlg.querySelector("#m_to").value.trim(),sub=dlg.querySelector("#m_sub").value,body=dlg.querySelector("#m_body").value;

    if(isMobile()&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:sub,text:body});ok=true}catch(e){if(e.name==="AbortError")return}
    }
    if(!ok&&isMobile()){
      if(file)downloadBlob(file,file.name);
      location.href="mailto:"+encodeURIComponent(to).replace(/%40/g,"@")+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body.replace(/\r?\n/g,"\r\n"));
      ok=true;
    }
    if(!ok){
      const nm=(f.type==="devis"?"Mail devis ":"Mail facture ")+f.no+" - "+cname(c).replace(/[\\/:*?"<>|]/g,"")+".eml";
      downloadBlob(await makeEml(to,sub,body,blob,pdfName(f)),nm);

      return `<div class="ln"><textarea data-i="${i}" data-f="d" rows="1" placeholder="Description">${esc(l.d)}</textarea><input data-i="${i}" data-f="q" type="number" step="0.25" value="${l.q}"><input data-i="${i}" data-f="p" type="number" step="0.05" value="${l.p}"><input data-i="${i}" data-f="r" type="number" step="1" value="${l.r||""}" placeholder="–">${del}</div>`;
    }).join("");
    requestAnimationFrame(()=>linesEl.querySelectorAll("textarea").forEach(t=>{t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}));
  }
  function read(){
    f.type=$("#e_type").value;f.status=$("#e_status").value;f.client=$("#e_client").value;f.date=$("#e_date").value||todayIso();f.cur=$("#e_cur").value;f.subject=$("#e_subject").value;f.text=$("#e_text").value;f.qr=$("#e_qr").checked;

  }

  drawLines();preview();
  linesEl.addEventListener("input",e=>{const t=e.target;if(t.dataset.i==null)return;const l=f.lines[+t.dataset.i];const k=t.dataset.f;l[k]=k==="d"?t.value:(t.value===""?0:+t.value);if(k==="d"&&t.tagName==="TEXTAREA"){t.style.height="auto";t.style.height=t.scrollHeight+"px"}preview()});

  document.querySelector(".form").addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(!b)return;const s=DB.settings,a=b.dataset.add;
    const before=f.lines.findIndex(l=>l.k==="pct"||l.k==="fee"); const ins=x=>{if((a==="line"||a==="hour"||a==="note")&&before>=0)f.lines.splice(before,0,x);else f.lines.push(x)};
    if(a==="line")ins({d:"",q:1,p:0}); if(a==="hour")ins({d:"",q:1,p:s.rate}); if(a==="note")ins({k:"note",d:""});
    if(a==="pct")ins({k:"pct",d:`Frais administratifs (${s.feePct}%)`,pct:s.feePct}); if(a==="fee")ins({k:"fee",d:"Frais administratifs",q:1,p:s.feeFixed});
    drawLines();preview()});
  ["e_type","e_status","e_date","e_cur","e_subject","e_text","e_qr"].forEach(id=>{$("#"+id).addEventListener("input",preview);$("#"+id).addEventListener("change",preview)});
  $("#e_no").addEventListener("input",()=>{noTouched=true;preview()});
  $("#e_client").addEventListener("change",e=>{if(client(e.target.value).country==="FR")$("#e_cur").value="EUR";preview()});
  function store(){read();if(!f.client){toast("Choisis un client");return false}
    const dup=DB.invoices.find(x=>x.no===f.no&&x.id!==f.id&&x.type===f.type);if(dup&&!confirm("Le numéro "+f.no+" existe déjà. Enregistrer quand même ?"))return false;
    const i=DB.invoices.findIndex(x=>x.id===f.id);if(i>=0)DB.invoices[i]=f;else DB.invoices.push(f);cur=f.id;save();return true}
  $("#e_save").onclick=()=>{if(store()){toast("Enregistrée");go("list")}};
  $("#e_print").onclick=()=>{if(store()){toast("Choisis ton imprimante, ou « Enregistrer au format PDF »");printInv(f)}};

  if($("#e_mail"))$("#e_mail").onclick=()=>{if(store())mailInv(DB.invoices.find(x=>x.id===f.id))};
  if($("#e_del"))$("#e_del").onclick=()=>{if(confirm("Supprimer "+f.no+" ? (Le PDF dans tes dossiers n'est pas touché.)")){DB.invoices=DB.invoices.filter(x=>x.id!==f.id);save();go("list")}};
}

  const mode=()=>$("#l_to").value;
  const showMode=()=>{$("#l_modeC").style.display=mode()==="client"?"":"none";$("#l_modeO").style.display=mode()==="other"?"":"none"};
  const chosen=()=>{if(mode()==="other")return $("#l_cl").value?[$("#l_cl").value]:[];return ex?[$("#l_client").value]:[...document.querySelectorAll("#l_list input:checked")].map(i=>i.value)};
  const read=()=>{l.to=mode();l.date=$("#l_date").value||todayIso();l.subject=$("#l_subject").value;l.body=$("#l_body").value;l.closing=$("#l_closing").value;
    l.toAddr=$("#l_toAddr").value;l.police=$("#l_police").value.trim();l.effDate=$("#l_eff").value;l.sign=$("#l_sign").checked};
  const preview=()=>{read();showMode();const ids=chosen();$("#l_info").textContent=ids.length>1?`Aperçu du 1er destinataire sur ${ids.length} – une lettre par client sera imprimée.`:"";
    $("#pv").innerHTML=letterHTML(l,ids.length?client(ids[0]):C({}));fitPreview()};
  preview();
  $("#main").addEventListener("input",preview);$("#main").addEventListener("change",preview);
  $("#l_tpl").onchange=e=>{const t=DB.templates.find(x=>x.id===e.target.value);if(!t)return;if((l.body||"").trim()&&!confirm("Remplacer le texte actuel par le modèle ?")){e.target.value="";return}
    $("#l_subject").value=t.subject;$("#l_body").value=t.body;$("#l_to").value=t.to||"client";$("#l_sign").checked=!!t.sign;
    if(t.to==="other"&&!$("#l_cl").value){const first=document.querySelector("#l_list input:checked");if(first)$("#l_cl").value=first.value}
    preview()};
  $("#l_ins").onchange=e=>{const a=(DB.insurers||[])[+e.target.value];if(a!=null&&e.target.value!==""){$("#l_toAddr").value=a;preview()}};
  if(!ex){
    $("#l_q").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#l_list label").forEach(x=>x.style.display=x.dataset.n.includes(q)?"":"none")};
    $("#l_all").onclick=()=>{document.querySelectorAll("#l_list input").forEach(i=>i.checked=client(i.value).status==="6 - Client signe");preview()};
    $("#l_none").onclick=()=>{document.querySelectorAll("#l_list input").forEach(i=>i.checked=false);preview()};
  }
  const store=()=>{read();const ids=chosen();
    if(!ids.length){toast(mode()==="other"?"Choisis le client concerné":"Choisis au moins un destinataire");return null}
    if(mode()==="other"&&!toLines(l).length){toast("Indique l'adresse du destinataire");return null}
    if(mode()==="other"){const a=toLines(l).join("\n");DB.insurers=DB.insurers||[];if(!DB.insurers.includes(a))DB.insurers.push(a)}
    if(ex){l.client=ids[0];DB.letters[DB.letters.findIndex(x=>x.id===l.id)]=l;save();return [l]}
    const made=ids.map((id,i)=>({...l,id:"l"+Date.now()+"_"+i,client:id}));DB.letters.push(...made);
    made.forEach(m=>{const c=client(m.client);if(!c.lastContact||m.date>c.lastContact)c.lastContact=m.date;
      DB.activities.push({id:"a"+Date.now()+m.client,client:m.client,date:m.date,type:"Courrier",summary:(m.to==="other"?"Lettre à "+(toLines(m)[0]||"")+" : ":"Lettre : ")+(fillTpl(m.subject,m,c)||"(sans objet)"),next:"",nextDate:""})});
    save();return made};
  $("#l_save").onclick=()=>{if(store()){toast("Lettre(s) enregistrée(s)");go("letters")}};
  $("#l_print").onclick=()=>{const m=store();if(!m)return;printPages(m.map(x=>letterHTML(x,client(x.client))).join(""),m.length>1?"Lettres ("+m.length+")":"Lettre "+letterTo(m[0]));go("letters")};
  $("#l_tsave").onclick=()=>{read();const n=prompt("Nom du modèle :",l.subject||"Mon modèle");if(!n)return;DB.templates.push({id:"t"+Date.now(),name:n,subject:l.subject,body:l.body,to:l.to,sign:l.sign});save();toast("Modèle enregistré")};
  if(ex)$("#l_del").onclick=()=>{if(confirm("Supprimer cette lettre ?")){DB.letters=DB.letters.filter(x=>x.id!==l.id);save();go("letters")}};
}

/* ================= Paramètres ================= */
function vSettings(){resetMain();
  const s=DB.settings;
  const F=(k,l,t="text")=>`<label class="f">${l}<input id="s_${k}" type="${t}" value="${esc(s[k])}"></label>`;
  $("#main").innerHTML=`<div class="stack" style="max-width:800px">
   <div class="card"><h2>Compte</h2>
    <p>Tes données sont enregistrées en ligne dans ta base privée : chaque modification est envoyée automatiquement et visible sur tous tes appareils (PC, iPhone).</p>
    <div class="row"><button class="btn" onclick="logout()">Se déconnecter</button></div></div>
   <div class="card"><h2>Mes coordonnées</h2><div class="grid3">${F("brand","Nom commercial")}${F("name","Nom")}${F("title","Titre")}${F("street","Rue")}${F("nr","N°")}${F("zip","NPA")}${F("city","Localité")}${F("phone","Téléphone")}${F("email","E-mail")}${F("web","Site web")}</div>
    <label class="f" style="margin-top:10px">Pied de page (factures et lettres)<input id="s_footer" value="${esc(s.footer)}"></label>
    <h3 style="margin-top:16px">Banque</h3><div class="grid4">${F("bank","Banque")}${F("iban","IBAN")}${F("bic","BIC")}${F("clearing","Clearing")}</div>
    <h3 style="margin-top:16px">Factures</h3><div class="grid3">${F("rate","Tarif horaire (CHF)","number")}
     <label class="f">Frais administratifs par défaut<select id="s_feeMode"><option value="pct">En %</option><option value="fixed">Montant fixe</option></select></label>
     ${F("feePct","Frais en %","number")}${F("feeFixed","Frais fixes (CHF)","number")}${F("delay","Délai de paiement (jours)","number")}
     <label class="f">QR-facture<select id="s_qr"><option value="1">Oui, en page 2</option><option value="0">Non</option></select></label></div>
    <label class="f" style="margin-top:12px">Texte standard des factures ({delai} et {politesse} sont remplacés automatiquement)<textarea id="s_text" rows="4">${esc(s.text)}</textarea></label>
    <h3 style="margin-top:16px">E-mail d'envoi des factures</h3>
    <p class="muted" style="font-size:12px;margin:0 0 6px">Mots remplacés automatiquement : {bonjour} {type} {type_min} {no} {date} {montant} {echeance} {objet} {client} {marque} {signature}</p>
    <label class="f">Objet<input id="s_mSub" value="${esc((s.mail||{}).subject||MAIL_DEF.subject)}"></label>
    <label class="f" style="margin-top:8px">Texte pour une facture<textarea id="s_mBody" rows="8">${esc((s.mail||{}).body||MAIL_DEF.body)}</textarea></label>
    <label class="f" style="margin-top:8px">Texte pour un devis<textarea id="s_mDev" rows="6">${esc((s.mail||{}).bodyDevis||MAIL_DEF.bodyDevis)}</textarea></label>
    <label class="row" style="margin-top:8px;font-size:13px"><input type="checkbox" id="s_mSig" ${s.mailSig?"checked":""}> Ajouter ma signature en texte simple à la place de {signature}. Laisse décoché si Outlook ajoute déjà ta signature.</label>
    <h3 style="margin-top:16px">Enveloppe à fenêtre (C5, feuille pliée en deux)</h3><div class="grid3">${F("addrX","Adresse : depuis la gauche (mm)","number")}${F("addrY","Adresse : depuis le haut (mm)","number")}<div style="align-self:end"><button class="btn" id="s_test">Imprimer une page test</button></div></div>
    <div class="row" style="margin-top:16px"><button class="btn pri" id="s_save">Enregistrer</button></div></div>
   <div class="card"><h3>Copie manuelle</h3><p class="muted">En plus de la sauvegarde automatique, tu peux télécharger une copie datée (fichier .json) ou en recharger une.</p>
    <p class="muted" style="font-size:12px">Conseil : télécharge une copie une fois par mois et range-la dans OneDrive (Comptabilité › Facturation › App Factures).</p>
    <div class="row"><button class="btn" id="bExport">Télécharger une copie</button><button class="btn" id="bImport">Recharger une copie</button><input type="file" id="fImport" accept=".json" hidden></div></div></div>`;
  $("#s_feeMode").value=s.feeMode;$("#s_qr").value=s.qr?"1":"0";
  const readS=()=>{["brand","name","title","street","nr","zip","city","phone","email","web","bank","iban","bic","clearing","text","footer"].forEach(k=>s[k]=$("#s_"+k).value.trim());
    ["rate","feePct","feeFixed","delay","addrX","addrY"].forEach(k=>s[k]=+$("#s_"+k).value||0);s.feeMode=$("#s_feeMode").value;s.qr=$("#s_qr").value==="1";
    s.mail={subject:$("#s_mSub").value,body:$("#s_mBody").value,bodyDevis:$("#s_mDev").value};s.mailSig=$("#s_mSig").checked};
  $("#s_save").onclick=()=>{readS();save();toast("Paramètres enregistrés")};
  $("#s_test").onclick=()=>{readS();save();printPages(testPageHTML(),"Page test enveloppe")};
  $("#bExport").onclick=()=>{const b=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Marotta-copie-"+todayIso()+".json";a.click()};
  $("#bImport").onclick=()=>$("#fImport").click();
  $("#fImport").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.invoices||!d.clients)throw 0;if(confirm("Remplacer les données actuelles par cette copie ("+d.clients.length+" clients, "+d.invoices.length+" factures) ?")){DB=d;addDefaults(DB);save();go("home");toast("Copie rechargée")}}catch(x){toast("Fichier invalide")}};r.readAsText(file);e.target.value=""};
}

boot();
</script>
</body>
</html>
